<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASDRON Innovation Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --panel: rgba(20,23,28,.94); --fondo: #0d0f12; --azul: #1e88e5; --gris: #aaaaaa; --verde: #66bb6a; --rojo: #c62828; --linea: #262b32; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fondo); color: #fff; font-family: Roboto, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 18px; padding: 12px 18px; background: var(--panel); border-bottom: 1px solid #222; flex-wrap: wrap; }
  .tarjeta { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 8px; padding: 6px 16px 6px 10px; }
  .tarjeta img { height: 52px; display: block; }
  .tarjeta .log { border-left: 1px solid #c9c9c9; padding-left: 14px; color: #333; font-weight: 300; font-size: 26px; letter-spacing: 9px; }
  header .titulo b { font-size: 19px; display: block; }
  header .titulo span { color: var(--gris); font-size: 14px; }
  .totales { display: flex; gap: 24px; margin-left: auto; flex-wrap: wrap; }
  .totales div { text-align: right; }
  .l { color: var(--gris); font-size: 12px; }
  .v { font-size: 21px; font-weight: 700; }
  .app { display: grid; grid-template-columns: 380px minmax(0, 1fr); height: calc(100vh - 81px); }
  .lateral { border-right: 1px solid #222; display: flex; flex-direction: column; min-height: 0; }
  .filtros { display: flex; gap: 8px; padding: 12px; flex-wrap: wrap; }
  .filtros input, .filtros select { background: #1a1e24; color: #fff; border: 1px solid #333; border-radius: 18px; padding: 8px 12px; font: 14px Roboto, sans-serif; }
  .filtros input { width: 100%; }
  .filtros select { flex: 1; min-width: 0; }
  #vuelos { overflow: auto; padding: 0 12px 12px; flex: 1; }
  .mes { padding: 12px 2px 6px; font-size: 14px; font-weight: 700; color: var(--azul); }
  .vuelo { background: var(--panel); border-radius: 8px; display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 8px; margin-bottom: 8px;
           border: 1.5px solid transparent; cursor: pointer; }
  .vuelo:hover { border-color: #3a4049; }
  .vuelo.sel { border-color: var(--azul); background: rgba(30,136,229,.14); }
  .vuelo svg { width: 96px; height: 72px; display: block; background: #12161b; border-radius: 4px; }
  .vuelo .cab { display: flex; justify-content: space-between; gap: 6px; align-items: start; }
  .vuelo b { font-size: 14px; }
  .vuelo .avion { color: var(--gris); font-size: 12px; }
  .vuelo .datos { font-size: 12px; color: #ddd; margin-top: 4px; }
  .estado { padding: 2px 8px; border-radius: 10px; font-weight: 700; font-size: 11px; white-space: nowrap; }
  .ok { background: #2e7d32; } .mal { background: var(--rojo); } .ambar { background: #ef6c00; }
  .fallos { color: #ff6b6b; font-size: 12px; margin-top: 3px; }
  .visor { display: flex; flex-direction: column; min-height: 0; }
  .barra { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid #222; flex-wrap: wrap; }
  .barra .nombre { font-weight: 700; font-size: 16px; margin-right: auto; }
  .btn { background: var(--azul); color: #fff; border: 0; border-radius: 16px; padding: 7px 14px; font: 700 13px Roboto, sans-serif; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .btn.borde { background: transparent; border: 1.5px solid #fff; }
  iframe { border: 0; width: 100%; flex: 1; background: var(--fondo); }
  .vacio { padding: 40px 18px; color: var(--gris); font-size: 16px; }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; height: auto; }
    .lateral { border-right: 0; } #vuelos { max-height: 46vh; }
    iframe { height: 92vh; flex: none; }
    .totales { margin-left: 0; }
  }
</style>
</head>

function miniatura(v) {
  const p = v.ruta; if (!p.length) return "<svg></svg>";
  const lats = p.map(q => q[0]), lons = p.map(q => q[1]);
  const la0 = Math.min(...lats), la1 = Math.max(...lats), lo0 = Math.min(...lons), lo1 = Math.max(...lons);
